[package]
name = "vehicle-analyzer-desktop"
version = "0.3.0"
description = "vehicle-analyzer desktop shell (Tauri 2, D-081 stage 2)"
authors = ["The vehicle-platform authors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[workspace]
members = ["hal"]

[dependencies]
tauri = { version = "2", features = [] }
vehicle-analyzer-hal = { path = "hal" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
vehicle-analyzer-hal = { path = "hal", features = ["socketcan"] }

[features]
default = ["custom-protocol", "slcan"]
custom-protocol = ["tauri/custom-protocol"]
# Serial SLCAN backend (serialport, MPL-2.0); off = the desktop has no USB source.
slcan = ["vehicle-analyzer-hal/slcan"]
socketcan = ["vehicle-analyzer-hal/socketcan"]

[profile.release]
lto = true
codegen-units = 1
strip = true
