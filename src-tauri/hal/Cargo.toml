[package]
name = "vehicle-analyzer-hal"
version = "0.3.0"
description = "Listen-only CAN adapter HAL for the vehicle-analyzer desktop shell (D-081 item 2)"
license = "MIT"
edition = "2021"
rust-version = "1.80"

[features]
default = []
# Real hardware backends. Off by default so the policy core builds and tests anywhere.
slcan = ["dep:serialport"]           # Lawicel/SLCAN over a serial port (serialport is MPL-2.0: optional)
socketcan = ["dep:socketcan"]        # Linux SocketCAN, incl. candleLight/gs_usb interfaces

[dependencies]
thiserror = "2"
serialport = { version = "4.10", optional = true, default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "4.0", optional = true, default-features = false, features = ["netlink"] }
