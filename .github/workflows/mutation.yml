# Opt-in mutation testing (QUALITY X-1 / T31). Weekly schedule and manual dispatch only:
# NOT part of `ci-ok`, never blocks a PR. Stryker mutates the modules in stryker.config.json
# (SLCAN parser, CSV escaping) against the tests that exercise them.
name: mutation

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stryker
        continue-on-error: true
        run: npx stryker run
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stryker-report
          path: reports/mutation/mutation.json
