name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the relative-URL submodule needs no secret.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          git -C external/vehicle-defs describe --tags --exact-match

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests are not part of `tsc -b` (tests/tsconfig.json is editor-only); this
      # keeps the fetch mocks and fixtures typed. 0 errors expected.
      - name: Type-check tests
        run: |
          npx tsc -p tests/tsconfig.json --noEmit
          npx tsc -p ui-tests/tsconfig.json --noEmit

      # WEB-1: typescript-eslint, type-checked. The warning count is a ratchet
      # (package.json --max-warnings): lower it as warnings are fixed, never raise it.
      - name: Lint
        run: npm run lint

      # WEB-2: v8 coverage with a ratcheting floor (vite.config.ts thresholds).
      - name: Test (coverage floor)
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      - name: Build
        run: npm run build

      # A8: every view opens with the virtual source, no console errors, no third-party request.
      - name: Install Playwright Chromium (retried, long download)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "attempt $i failed"; done
          exit 1

      - name: UI smoke tests
        run: npm run test:ui

  # A6 desktop shell (D-081 stage 2): the Tauri wrapper compiles, lints clean and
  # embeds the same frontend build. Bundles (.dmg, AppImage/.deb, .msi) come with
  # the listen-only HAL.
  desktop:
    # macOS: Tauri 2 needs no extra system libraries there (ubuntu's webkit2gtk
    # apt set is several hundred MB and has stalled the runner), and it is the
    # developer machine's platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend build (embedded by the shell)
        run: npm run build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy (shell + HAL with the serial backend)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets --features vehicle-analyzer-hal/slcan -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --workspace --features vehicle-analyzer-hal/slcan

  # A6 HAL on Linux: the SocketCAN backend compiles only there. No system
  # libraries needed (serialport without libudev, socketcan is pure Rust).
  hal-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: clippy (all HAL features)
        working-directory: src-tauri
        run: cargo clippy --locked -p vehicle-analyzer-hal --all-targets --all-features -- -D warnings

      - name: cargo test (all HAL features)
        working-directory: src-tauri
        run: cargo test --locked -p vehicle-analyzer-hal --all-features

  # Aggregate required check (QUALITY CI-4): one stable name for the ruleset.
  # `skipped` counts as OK; `failure` and `cancelled` fail it.
  ci-ok:
    if: always()
    needs: [test, desktop, hal-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
