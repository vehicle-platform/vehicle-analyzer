name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the relative-URL submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          git -C external/vehicle-defs describe --tags --exact-match

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The tests are not part of `tsc -b` (tests/tsconfig.json is editor-only); this
      # keeps the fetch mocks and fixtures typed. 0 errors expected.
      - name: Type-check tests
        run: npx tsc -p tests/tsconfig.json --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A8: every view opens with the virtual source, no console errors, no third-party request.
      - name: Install Playwright Chromium (retried, long download)
        run: |
          for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "attempt $i failed"; done
          exit 1

      - name: UI smoke tests
        run: npm run test:ui

  # A6 desktop shell (D-081 stage 2): the Tauri wrapper compiles, lints clean and
  # embeds the same frontend build. Bundles (.dmg, AppImage/.deb, .msi) come with
  # the listen-only HAL.
  desktop:
    # macOS: Tauri 2 needs no extra system libraries there (ubuntu's webkit2gtk
    # apt set is several hundred MB and has stalled the runner), and it is the
    # developer machine's platform.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend build (embedded by the shell)
        run: npm run build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy (shell + HAL with the serial backend)
        working-directory: src-tauri
        run: cargo clippy --locked --workspace --all-targets --features vehicle-analyzer-hal/slcan -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --workspace --features vehicle-analyzer-hal/slcan

  # A6 HAL on Linux: the SocketCAN backend compiles only there. No system
  # libraries needed (serialport without libudev, socketcan is pure Rust).
  hal-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: clippy (all HAL features)
        working-directory: src-tauri
        run: cargo clippy --locked -p vehicle-analyzer-hal --all-targets --all-features -- -D warnings

      - name: cargo test (all HAL features)
        working-directory: src-tauri
        run: cargo test --locked -p vehicle-analyzer-hal --all-features
