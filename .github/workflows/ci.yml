name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # vehicle-defs is public (D-033): the relative-URL submodule needs no secret.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # D-003/D-036: consumers pin defs to a release tag, never a branch commit.
      - name: Defs pin must be a tag
        run: |
          git -C external/vehicle-defs fetch --quiet --depth=1 origin '+refs/tags/*:refs/tags/*'
          git -C external/vehicle-defs describe --tags --exact-match

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # A8: every view opens with the virtual source, no console errors, no third-party request.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: UI smoke tests
        run: npm run test:ui

  # A6 desktop shell (D-081 stage 2): the Tauri wrapper compiles, lints clean and
  # embeds the same frontend build. Bundles (.dmg, AppImage/.deb, .msi) come with
  # the listen-only HAL.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: System libraries for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend build (embedded by the shell)
        run: npm run build

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
